# Copyparty volumes map directly to the normal Linux storage locations.
[global]
  i: 192.168.7.1
  p: 8080
  theme: 1
  html-head: @/usr/share/reader/files-head.html
  name: ReRead storage
  name-url: http://192.168.7.1/#files
  http-only
  no-crt
  no-ansi
  no-thumb
  no-mtag-ff
  no-logues
  no-readme
  # Keep upstream text editing enabled; downloaded HTML cannot run scripts.
  no-script
  no-reload
  hist: /var/lib/reader/file-manager/history
  df: 64m
  md-hist: n

[/]
  /var/lib/reader/file-manager/home
  accs:
    r: *

[/files]
  /var/lib/reader/files
  accs:
    rwmd: *

[/app-data]
  /var/lib/reader/apps
  accs:
    rwmd: *

[/cache]
  /root/.cache
  accs:
    rwmd: *

[/configuration]
  /etc/reread/apps
  accs:
    rwmd: *

[/preferences]
  /root/.config
  accs:
    rwmd: *

[/programs]
  /usr/lib/reread/apps
  accs:
    r: *

[/assets]
  /usr/share/reread/apps
  accs:
    r: *

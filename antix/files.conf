# Copyparty: one ordinary shared folder on the existing Linux filesystem.
[global]
  i: 192.168.7.1
  p: 8080
  theme: 1
  html-head: @/usr/share/reader/files-head.html
  name: ReRead files
  name-url: http://192.168.7.1/#files
  http-only
  no-crt
  no-ansi
  no-thumb
  no-mtag-ff
  no-logues
  no-readme
  no-html
  no-reload
  hist: /var/lib/reader/file-manager/history
  df: 64m
  md-hist: n

[/]
  /var/lib/reader/files
  accs:
    rwmd: *

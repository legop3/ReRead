# Hold: 1 means unlocked, 0 locked. Power remains elogind's responsibility.
KEY_COFFEE 0 @locked
KEY_COFFEE 1 @
KEY_VOLUMEUP@ 1 /usr/local/sbin/reader-volume-key up
KEY_VOLUMEUP@ 2 /usr/local/sbin/reader-volume-key up
KEY_VOLUMEDOWN@ 1 /usr/local/sbin/reader-volume-key down
KEY_VOLUMEDOWN@ 2 /usr/local/sbin/reader-volume-key down
# Unlocked is a continuously pressed key, so triggerhappy sees it as a modifier.
KEY_VOLUMEUP+KEY_COFFEE@ 1 /usr/local/sbin/reader-volume-key up
KEY_VOLUMEUP+KEY_COFFEE@ 2 /usr/local/sbin/reader-volume-key up
KEY_VOLUMEDOWN+KEY_COFFEE@ 1 /usr/local/sbin/reader-volume-key down
KEY_VOLUMEDOWN+KEY_COFFEE@ 2 /usr/local/sbin/reader-volume-key down

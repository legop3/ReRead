%
<!-- Copyparty's supported html-head customization; upstream assets stay unmodified. -->
<style>
body{font-family:system-ui,sans-serif}
#ops{display:flex;flex-wrap:wrap;gap:3px;padding:4px}
#ops a{font-size:13px;padding:4px 7px;border-radius:2px}
#ops a:after{font-size:12px;margin-left:4px}
#opa_x:after{content:'Close'}
#opa_up:after{content:'Upload'}
#opa_bup:after{content:'Basic upload'}
#opa_mkd:after{content:'New folder'}
#opa_md:after{content:'New text file'}
#opa_cfg:after{content:'Preferences'}
#opa_auc:after{content:'Player'}
#opa_del:after{content:'Undo upload'}
#opa_srch:after{content:'Search'}
#opa_msg{display:none!important}
</style>

<style>
body.rr-overview #ops,body.rr-overview #tree,body.rr-overview #path,body.rr-overview #wrap{display:none!important}
#rr-storage{font-family:system-ui,sans-serif;background:white;color:#182b37;border:1px solid #bfc7cd}
#rr-storage nav{display:flex;flex-wrap:wrap}
#rr-storage nav a{color:#294657;border:1px solid #bfc7cd;text-decoration:none}
#rr-storage .rr-path{font:12px ui-monospace,monospace;overflow-wrap:anywhere}
#rr-storage{margin:8px;padding:10px;border-top:1px solid #bfc7cd;font-size:13px}
#rr-storage h1{font-size:17px;margin-bottom:8px}
#rr-storage nav{gap:4px}#rr-storage nav a{padding:4px 8px;border-radius:0;font-size:12px}
#rr-storage nav a[aria-current]{background:#285a75;border-color:#285a75}
#rr-storage p{margin:8px 0;font-size:12px}
#rr-storage .rr-areas{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
#rr-storage .rr-areas th,#rr-storage .rr-areas td{padding:7px 9px;border:1px solid #c8d1d8;text-align:left;vertical-align:top}
#rr-storage .rr-areas th{background:#e9edf0;color:#334956;font-weight:600}
#rr-storage .rr-areas tr:nth-child(even){background:#f6f8f9}
#rr-storage .rr-card{padding:0;border:0;font-size:12px;font-weight:600;white-space:nowrap;color:#235c7d;text-decoration:underline}
#rr-storage .rr-areas code{font-size:11px;overflow-wrap:anywhere}
@media(max-width:600px){ #rr-storage .rr-areas th:last-child,#rr-storage .rr-areas td:last-child{display:none}#rr-storage .rr-areas td{padding:6px}}
</style>
<script nonce="{{ js_nonce }}">
document.addEventListener('DOMContentLoaded',function(){
 const areas=[
  ['files','Shared files','/var/lib/reader/files','Photos, music, documents and downloads. The same folders used by Reader apps.'],
  ['app-data','App data','/var/lib/reader/apps','Preferences, databases and history. Close an app before editing or restoring its data.'],
  ['cache','Caches','/root/.cache','Disposable downloads and thumbnails. Close the app before clearing its cache.'],
  ['configuration','App configuration','/etc/reread/apps','API keys, server URLs and saved searches. Web Apps → Settings offers guided editing.'],
  ['preferences','XDG preferences','/root/.config','Configuration used by apps following the standard XDG config location.'],
  ['programs','Installed programs','/usr/lib/reread/apps','Browse and download installed app code. Managed by APT; read-only here.'],
  ['assets','Installed assets','/usr/share/reread/apps','Browse packaged schemas and other app resources. Managed by APT; read-only here.']
 ];
 let previousArea=null;
 function render(){
 const currentArea=location.pathname.split('/')[1];
 if(previousArea===currentArea)return;previousArea=currentArea;
 const old=document.getElementById('rr-storage');if(old)old.remove();
 const panel=document.createElement('header');panel.id='rr-storage';
 const title=document.createElement('h1');title.textContent='ReRead storage';panel.append(title);
 const nav=document.createElement('nav');nav.setAttribute('aria-label','Storage areas');
 const path=decodeURIComponent(location.pathname).split('/')[1];
 for(const a of [['','Overview'],...areas.map(a=>[a[0],a[1]])]){
  const link=document.createElement('a');link.href='/'+(a[0]?a[0]+'/':'');link.textContent=a[1];if(path===a[0])link.setAttribute('aria-current','page');nav.append(link);
 }
 panel.append(nav);
 const area=areas.find(a=>a[0]===path);
 document.body.classList.toggle('rr-overview',!area && location.pathname==='/');
 if(area){
  const note=document.createElement('p');note.textContent=area[3];panel.append(note);
  const real=document.createElement('div');real.className='rr-path';real.textContent=area[2];panel.append(real);
 }else{
  const intro=document.createElement('p');intro.textContent='One SSD, organized by purpose. These are the real folders on your Reader, with no import or synchronization step.';panel.append(intro);
  const cards=document.createElement('table');cards.className='rr-areas';
  const head=document.createElement('thead'),headRow=document.createElement('tr');
  for(const title of ['Area','Linux location','Contents']){const cell=document.createElement('th');cell.textContent=title;headRow.append(cell);}head.append(headRow);cards.append(head);
  const body=document.createElement('tbody');
  for(const a of areas){
   const row=document.createElement('tr'),name=document.createElement('td'),path=document.createElement('td'),description=document.createElement('td');
   const link=document.createElement('a');link.className='rr-card';link.href='/'+a[0]+'/';link.textContent=a[1];name.append(link);
   const code=document.createElement('code');code.textContent=a[2];path.append(code);description.textContent=a[3];
   row.append(name,path,description);body.append(row);
  }
  cards.append(body);
  panel.append(cards);
 }
 document.body.prepend(panel);
 }
 render();
 new MutationObserver(render).observe(document.body,{childList:true,subtree:true});
 window.addEventListener('popstate',render);
});
</script>

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Module"
    Disable "glx"
    Disable "dri"
    Disable "dri2"
EndSection
Section "Device"
    Identifier "Reader framebuffer"
    Driver "fbdev"
    BusID "PCI:0:2:0"
    Option "fbdev" "/dev/fb0"
EndSection
Section "Screen"
    Identifier "Reader screen"
    Device "Reader framebuffer"
    DefaultDepth 24
EndSection
Section "ServerLayout"
    Identifier "Reader layout"
    Screen "Reader screen"
EndSection

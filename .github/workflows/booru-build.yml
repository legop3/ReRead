name: Build Booru test package

on:
  push:
    branches: [main]
    paths:
      - 'antix/apps/booru/**'
      - '.github/workflows/booru-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build i386 toolchain image
        run: docker build -t reread-builder -f image-builder/Dockerfile .
      - name: Build independent Booru package
        run: docker run --rm -v "$PWD:/work" reread-builder python3 /work/antix/apps/booru/package.py
      - name: Upload Booru test package
        uses: actions/upload-artifact@v4
        with:
          name: reread-app-booru-i386
          path: out/antix/reread-app-booru_*.deb
          if-no-files-found: error
